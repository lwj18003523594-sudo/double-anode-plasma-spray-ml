# 数据字典（V1.2）
# 说明：
# - 英文内部名称是程序与数据文件的唯一标准字段名，禁止修改；
# - 中文名称仅用于界面显示；
# - 「重复测量处理」描述同一 experiment_id 下多次测量进入模型前的建议聚合方式；
# - 标注「正式实验前必须人工确认定义」的字段，其物理含义与计算/测量方法
#   必须由实验负责人在正式实验前确认，本文件不代替用户定义物理公式。

identity_fields:

  experiment_id:
    中文名: 实验条件编号
    英文内部名称: experiment_id
    物理含义: 一组独立实验条件（同一条件下可含多个批次/试样）的唯一编号
    单位: "-"
    数据类型: 字符串
    测量方法: 实验记录时人工分配
    是否模型输入: 否（仅作标识）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 同一实验条件的重复批次/试样共用同一 experiment_id

  batch_id:
    中文名: 独立喷涂批次编号
    英文内部名称: batch_id
    物理含义: 一次独立喷涂过程；同一批次内材料状态高度相关
    单位: "-"
    数据类型: 字符串
    测量方法: 喷涂时人工分配
    是否模型输入: 否（仅作分组标识）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 机器学习交叉验证分组最高优先级依据；同批次样本绝不跨训练/验证

  sample_id:
    中文名: 具体试样编号
    英文内部名称: sample_id
    物理含义: 从某一喷涂批次上取下的具体试样（如拉伸试棒、金相块）
    单位: "-"
    数据类型: 字符串
    测量方法: 取样时人工分配（模板已预留，可暂不填写）
    是否模型输入: 否（仅作标识）
    是否模型输出: 否
    是否允许缺失: 是（V1 阶段允许）
    重复测量处理方法: 同一试样多次测量共用同一 sample_id

  replicate_id:
    中文名: 重复测量编号
    英文内部名称: replicate_id
    物理含义: 同一试样上同一指标的重复测量次序（如硬度打 5 点）
    单位: "-"
    数据类型: 整数或字符串
    测量方法: 测量时人工分配（模板已预留，可暂不填写）
    是否模型输入: 否（仅作标识）
    是否模型输出: 否
    是否允许缺失: 是（V1 阶段允许）
    重复测量处理方法: 建议取算术平均后按试样/批次汇总，再进入模型

input_fields:

  nozzle_throat_mm:
    中文名: 喷嘴喉部直径
    英文内部名称: nozzle_throat_mm
    物理含义: 喷嘴喉道直径，决定射流通道最小截面
    单位: mm
    数据类型: 数值（连续）
    测量方法: 喷枪图纸/量具实测
    是否模型输入: 是（结构参数）
    是否模型输出: 否
    是否允许缺失: 否（结构固定时建议仍记录）
    重复测量处理方法: 每批次单一值

  nozzle_exit_mm:
    中文名: 喷嘴出口直径
    英文内部名称: nozzle_exit_mm
    物理含义: 喷嘴出口截面直径
    单位: mm
    数据类型: 数值（连续）
    测量方法: 喷枪图纸/量具实测
    是否模型输入: 是（结构参数）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 每批次单一值

  secondary_laval_length_mm:
    中文名: 二级拉瓦尔段长度
    英文内部名称: secondary_laval_length_mm
    物理含义: 二级拉瓦尔喷管段的轴向长度
    单位: mm
    数据类型: 数值（连续）
    测量方法: 喷枪图纸/量具实测
    是否模型输入: 是（结构参数）
    是否模型输出: 否
    是否允许缺失: 否（无二级拉瓦尔时记 0）
    重复测量处理方法: 每批次单一值

  anode_spacing_mm:
    中文名: 双阳极间距
    英文内部名称: anode_spacing_mm
    物理含义: 两个阳极之间的距离
    单位: mm
    数据类型: 数值（连续）
    测量方法: 装配测量
    是否模型输入: 是（结构参数）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 每批次单一值

  powder_injection_angle_deg:
    中文名: 送粉注入角
    英文内部名称: powder_injection_angle_deg
    物理含义: 送粉管相对射流轴线的注入角度
    单位: °
    数据类型: 数值（连续）
    测量方法: 装配测量
    是否模型输入: 是（结构参数）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 每批次单一值

  anode1_current_A:
    中文名: 阳极1电流
    英文内部名称: anode1_current_A
    物理含义: 阳极 1（第一阳极）电弧电流设定/实测值
    单位: A
    数据类型: 数值（连续）
    测量方法: 电源控制面板记录
    是否模型输入: 是（工艺参数）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 每批次取均值

  anode2_current_A:
    中文名: 阳极2电流
    英文内部名称: anode2_current_A
    物理含义: 阳极 2（第二阳极）电弧电流设定/实测值
    单位: A
    数据类型: 数值（连续）
    测量方法: 电源控制面板记录
    是否模型输入: 是（工艺参数）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 每批次取均值

  Ar_flow_slpm:
    中文名: Ar 气体流量
    英文内部名称: Ar_flow_slpm
    物理含义: 主气（氩气）体积流量
    单位: L/min
    数据类型: 数值（连续）
    测量方法: 气体流量计读数记录
    是否模型输入: 是（工艺参数）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 每批次取均值

  H2_flow_slpm:
    中文名: H₂ 气体流量
    英文内部名称: H2_flow_slpm
    物理含义: 次气（氢气）体积流量
    单位: L/min
    数据类型: 数值（连续）
    测量方法: 气体流量计读数记录
    是否模型输入: 是（工艺参数）
    是否模型输出: 否
    是否允许缺失: 否（纯 Ar 时记 0）
    重复测量处理方法: 每批次取均值

  powder_feed_g_min:
    中文名: 送粉速率
    英文内部名称: powder_feed_g_min
    物理含义: 单位时间送入喷枪的粉末质量
    单位: g/min
    数据类型: 数值（连续）
    测量方法: 送粉器设定/标定
    是否模型输入: 是（工艺参数）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 每批次取均值

  spray_distance_mm:
    中文名: 喷涂距离
    英文内部名称: spray_distance_mm
    物理含义: 喷嘴出口到基体表面的距离
    单位: mm
    数据类型: 数值（连续）
    测量方法: 喷涂前实测
    是否模型输入: 是（工艺参数）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 每批次取均值

  traverse_speed_mm_s:
    中文名: 喷枪移动速度
    英文内部名称: traverse_speed_mm_s
    物理含义: 喷枪相对基体的移动速度
    单位: mm/s
    数据类型: 数值（连续）
    测量方法: 机器人/导轨设定记录
    是否模型输入: 是（工艺参数）
    是否模型输出: 否
    是否允许缺失: 否
    重复测量处理方法: 每批次取均值

intermediate_fields:

  arc_voltage_V:
    中文名: 电弧电压
    英文内部名称: arc_voltage_V
    物理含义: 双阳极电弧弧压，反映电弧状态
    单位: V
    数据类型: 数值（连续）
    测量方法: 电源电压表记录
    是否模型输入: 否（一级模型输出）
    是否模型输出: 否（中间量）
    是否允许缺失: 是
    重复测量处理方法: 每批次取均值

  jet_temperature_K:
    中文名: 射流温度
    英文内部名称: jet_temperature_K
    物理含义: 等离子射流特征温度
    单位: K
    数据类型: 数值（连续）
    测量方法: 发射光谱/焓探针等诊断（按实验大纲执行）
    是否模型输入: 否（一级模型输出）
    是否模型输出: 否（中间量）
    是否允许缺失: 是
    重复测量处理方法: 每批次取均值

  jet_velocity_m_s:
    中文名: 射流速度
    英文内部名称: jet_velocity_m_s
    物理含义: 等离子射流特征速度
    单位: m/s
    数据类型: 数值（连续）
    测量方法: 高速摄像/PIV 等诊断（按实验大纲执行）
    是否模型输入: 否（一级模型输出）
    是否模型输出: 否（中间量）
    是否允许缺失: 是
    重复测量处理方法: 每批次取均值

  particle_temperature_C:
    中文名: 粒子温度
    英文内部名称: particle_temperature_C
    物理含义: 喷涂粒子在飞行方向上的表面/特征温度
    单位: ℃
    数据类型: 数值（连续）
    测量方法: 粒子测温仪（如 SprayWatch 等）
    是否模型输入: 否（一级模型输出）
    是否模型输出: 否（中间量）
    是否允许缺失: 是
    重复测量处理方法: 每批次取均值

  particle_velocity_m_s:
    中文名: 粒子速度
    英文内部名称: particle_velocity_m_s
    物理含义: 喷涂粒子飞行速度
    单位: m/s
    数据类型: 数值（连续）
    测量方法: 粒子测速仪
    是否模型输入: 否（一级模型输出）
    是否模型输出: 否（中间量）
    是否允许缺失: 是
    重复测量处理方法: 每批次取均值

defect_fields:

  porosity_pct:
    中文名: 孔隙率
    英文内部名称: porosity_pct
    物理含义: 涂层截面中孔隙面积占比
    单位: "%"
    数据类型: 数值（连续）
    测量方法: 金相截面图像分析
    是否模型输入: 否（二级模型输出）
    是否模型输出: 是（亦作逆向目标）
    是否允许缺失: 是
    重复测量处理方法: 同试样多视场取均值

  lamellar_gap_pct:
    中文名: 层间未结合率
    英文内部名称: lamellar_gap_pct
    物理含义: 涂层层间未结合界面占比
    单位: "%"
    数据类型: 数值（连续）
    测量方法: 金相截面图像分析
    是否模型输入: 否（二级模型输出）
    是否模型输出: 是
    是否允许缺失: 是
    重复测量处理方法: 同试样多视场取均值

  unmelted_particle_pct:
    中文名: 未熔颗粒比例
    英文内部名称: unmelted_particle_pct
    物理含义: 涂层中未完全熔化颗粒的面积/数量占比
    单位: "%"
    数据类型: 数值（连续）
    测量方法: 金相截面图像分析
    是否模型输入: 否（二级模型输出）
    是否模型输出: 是
    是否允许缺失: 是
    重复测量处理方法: 同试样多视场取均值

  crack_density_mm_mm2:
    中文名: 裂纹密度
    英文内部名称: crack_density_mm_mm2
    物理含义: 单位面积涂层截面上裂纹总长度
    单位: mm/mm²
    数据类型: 数值（连续）
    测量方法: 金相截面图像分析
    是否模型输入: 否（二级模型输出）
    是否模型输出: 是
    是否允许缺失: 是
    重复测量处理方法: 同试样多视场取均值

  defect_connectivity_index:
    中文名: 缺陷连通度指数
    英文内部名称: defect_connectivity_index
    物理含义: 缺陷（孔/裂纹）相互连通程度的综合指标
    单位: 0-1
    数据类型: 数值（连续）
    测量方法: 【正式实验前必须人工确认定义】——建议结合截面图像分析、三维 CT 或连通孔/裂纹统计明确定义与计算流程，本文件不代替用户定义物理公式
    是否模型输入: 否（二级模型输出）
    是否模型输出: 是
    是否允许缺失: 是
    重复测量处理方法: 待定义确认后确定

performance_fields:

  bond_strength_MPa:
    中文名: 结合强度
    英文内部名称: bond_strength_MPa
    物理含义: 涂层与基体界面结合强度
    单位: MPa
    数据类型: 数值（连续）
    测量方法: 拉伸法（如 ASTM C633 或对应国标）
    是否模型输入: 否（三级模型输出）
    是否模型输出: 是（亦作逆向目标）
    是否允许缺失: 是
    重复测量处理方法: 同批次多试样取均值并记录标准差

  hardness_HV:
    中文名: 显微硬度
    英文内部名称: hardness_HV
    物理含义: 涂层截面显微硬度
    单位: HV
    数据类型: 数值（连续）
    测量方法: 显微硬度计（规定载荷/保载时间）
    是否模型输入: 否（三级模型输出）
    是否模型输出: 是
    是否允许缺失: 是
    重复测量处理方法: 多点测量取均值

  wear_rate_mg_m:
    中文名: 磨损率
    英文内部名称: wear_rate_mg_m
    物理含义: 单位滑动距离的质量损失
    单位: mg/m
    数据类型: 数值（连续）
    测量方法: 【正式实验前必须人工确认定义】——摩擦磨损试验条件（载荷、对偶、行程等）与磨损率归一化方式需按实验大纲确认，本文件不代替用户定义物理公式
    是否模型输入: 否（三级模型输出）
    是否模型输出: 是
    是否允许缺失: 是
    重复测量处理方法: 待定义确认后确定

  corrosion_current_uA_cm2:
    中文名: 腐蚀电流密度
    英文内部名称: corrosion_current_uA_cm2
    物理含义: 电化学腐蚀电流密度（腐蚀速率的电化学表征量）
    单位: μA/cm²
    数据类型: 数值（连续）
    测量方法: 动电位极化曲线测试（介质/扫描参数按实验大纲）
    是否模型输入: 否（三级模型输出）
    是否模型输出: 是
    是否允许缺失: 是
    重复测量处理方法: 同批次平行试样取均值

  cavitation_mass_loss_mg:
    中文名: 空蚀失重
    英文内部名称: cavitation_mass_loss_mg
    物理含义: 空蚀试验规定时长后的累计质量损失
    单位: mg
    数据类型: 数值（连续）
    测量方法: 空蚀试验（试验时长/条件按实验大纲）+ 天平称重
    是否模型输入: 否（三级模型输出）
    是否模型输出: 是
    是否允许缺失: 是
    重复测量处理方法: 同批次平行试样取均值

  coupled_damage_rate:
    中文名: 耦合损伤指标
    英文内部名称: coupled_damage_rate
    物理含义: 磨损-腐蚀（或空蚀-腐蚀等）耦合作用下损伤速率的综合表征量
    单位: a.u.
    数据类型: 数值（连续）
    测量方法: 【正式实验前必须人工确认定义】——耦合损伤的试验组合与计算/归一化方式需按实验大纲确认，本文件不代替用户定义物理公式
    是否模型输入: 否（三级模型输出）
    是否模型输出: 是（亦作逆向目标）
    是否允许缺失: 是
    重复测量处理方法: 待定义确认后确定

  deposition_efficiency_pct:
    中文名: 沉积效率
    英文内部名称: deposition_efficiency_pct
    物理含义: 沉积到基体的粉末质量占送入粉末质量的比例
    单位: "%"
    数据类型: 数值（连续）
    测量方法: 称重法（喷涂前后基体增重 / 送粉量）
    是否模型输入: 否（三级模型输出）
    是否模型输出: 是（工程约束）
    是否允许缺失: 是
    重复测量处理方法: 每批次取均值
